name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ["3.9", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - run: pip install . && vibestrata --version && vibestrata scan --summary && vibestrata sweep
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm pack && npx --yes ./vibestrata-*.tgz --version && npx --yes ./vibestrata-*.tgz scan --summary
